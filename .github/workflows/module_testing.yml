name: Provider checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go mod verify
      - run: go test -mod=readonly ./...
      - run: go test -mod=readonly -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -mod=readonly .
